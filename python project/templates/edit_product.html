{% extends 'base.html' %}

{% block title %}Edit Product #{{ product.id }} | Inventory & Sales Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
        <div class="d-flex align-items-center justify-content-between mb-4">
            <div>
                <a href="{{ url_for('products.index') }}" class="btn btn-outline-secondary btn-sm mb-2">← Back to Products</a>
                <h1 class="page-title mb-0">Edit Product #{{ product.id }}</h1>
            </div>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle fs-6 px-3 py-2">
                ID: {{ product.id }}
            </span>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form action="{{ url_for('products.edit', product_id=product.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="category" class="form-label fw-semibold">Category</label>
                        <input type="text" class="form-control" id="category" name="category" value="{{ product.category or '' }}" placeholder="e.g. Electronics, Peripherals">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="price" class="form-label fw-semibold">Price (₹) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="price" name="price" step="0.01" min="0" value="{{ '%.2f'|format(product.price) }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="stock" class="form-label fw-semibold">Current Stock <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="stock" name="stock" min="0" value="{{ product.stock }}" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ product.description or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('products.index') }}" class="btn btn-light border">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
